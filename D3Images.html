<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Metadata -->
    <!-- 
        The <meta> tag provides metadata about the HTML document.
         Metadata is data (information) about data. The <meta> tags always 
         go inside the <head> element, and are typically used to specify character set,
         page description, keywords, author of the document, and viewport settings.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictures</title>

</head>

<body>

    <!-- HTML allows you to add images to your web pages using the <img> tag. -->
    <!-- The <img> tag is an empty tag, meaning it does not have a closing tag. -->
    <!-- The <img> tag has two required attributes: src and alt. -->
