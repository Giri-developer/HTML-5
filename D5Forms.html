<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>

    <div align="center">
        <h3>Student Database Management Systems</h3>
        <form>
            <!-- Text Area  -->
            <label>Student Name : </label>
            <input type="text" size="50" required><br><br>

            <!-- Passwords -->
            <label>Password :</label>
            <input type="password" size="50" min="4" max="8" required><br><br>

            <!-- Emails -->
            <label>Email ID :</label>
            <input type="email" size="50" required><br><br>

            <!-- Date/Month/Year -->
            <label>Date of Birth :</label>
            <input type="date" size="50" required><br><br>

            <!-- Radio button -->
            <label>Gender :</label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female<br><br>

            <!-- Selection box -->
            <label>Department :</label>
            <select>
                <option>CS</option>
                <option>BCA</option>
                <option>IT</option>2
                <option>Tamil</option>
                <option>English</option>
            </select><br><br>

            <!-- Submit and Reset button -->
            <input type="submit" value="Submit"><br><br>
            <input type="reset" value="Reset">
        </form>
    </div>

</body>

</html>
