<!DOCTYPE html>
<html lang="en">

<head>

    <!-- The "title" tag defines the title of the webpage. It appears in the browser tab. -->
    <title>Introduction</title>

</head>

<body>

    <!-- "p" – Paragraph -->
    <!-- Used to create a paragraph. -->
    <p>This is a paragraph.</p>

    <!-- "pre" – Preformatted Text -->
    <!-- Used to display text in a fixed-width font, preserving both spaces and line breaks. -->
    <pre>This is preformatted text.</pre>

    <!-- "h1 to h6" – Heading -->
    <!-- Used to create headings of different levels. -->
    <h1>This is a heading.</h1>
    <h2>This is a subheading.</h2>
    <h3>This is a sub-subheading.</h3>
    <h4>This is a sub-sub-subheading.</h4>
    <h5>This is a sub-sub-sub-subheading.</h5>
    <h6>This is a sub-sub-sub-sub-subheading.</h6>

    <!-- "hr" – Horizontal Rule -->
    <!-- Used to create a horizontal line. -->
    <hr>

</body>

</html>
